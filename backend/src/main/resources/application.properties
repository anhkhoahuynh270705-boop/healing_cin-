spring.application.name=healing-cinema-server
server.port=8080
# Database configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/healing_cinema}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Khoa123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Flywaty configuration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Admin configuration
app.admin.username=${CINEMA_ADMIN_USERNAME:admin}
app.admin.password=${CINEMA_ADMIN_PASSWORD:admin}
app.admin-key=${CINEMA_ADMIN_KEY:khoa123}
