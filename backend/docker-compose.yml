services:
  postgres:
    image: postgres:16-alpine
    container_name: healing-cinema-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: healing_cinema
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - healing-cinema-postgres-data:/var/lib/postgresql/data

volumes:
  healing-cinema-postgres-data:
