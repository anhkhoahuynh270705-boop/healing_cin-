<main class="lobby-page">
  <header class="lobby-header">
    <a class="lobby-brand" href="/" aria-label="Healing Ciné - sảnh chính">
      <span class="lobby-brand-mark"><i class="fa-solid fa-clapperboard" aria-hidden="true"></i></span>
      <span><strong>HEALING CINÉ</strong><small>THE PRIVATE MOVIE LOUNGE</small></span>
    </a>
    <div class="lobby-header-actions">
      <button type="button" class="lobby-wallet-button" (click)="donationRequested.emit()">
        <i class="fa-solid fa-gift" aria-hidden="true"></i><span>Khuyến mãi nạp x2</span>
      </button>
      <button type="button" class="lobby-vip-button" (click)="donationRequested.emit()">
        <i class="fa-solid fa-crown" aria-hidden="true"></i><span>VIP {{ vipLevel() }}</span>
      </button>
      <button type="button" class="lobby-login-button" (click)="loginRequested.emit()">
        <i class="fa-regular fa-user" aria-hidden="true"></i>
        <span>{{ displayName() }}</span>
      </button>
    </div>
  </header>

  <section class="lobby-stage" aria-label="Sảnh chờ 3D toàn màn hình">
    <app-lobby-scene
      [displayName]="displayName()"
      [vipLevel]="vipLevel()"
      [gender]="gender()"
      [shirtColorIndex]="shirtColorIndex()"
      [shirtColor]="shirtColor()"
      [shirtTier]="shirtTier()"
      [accessoryIndex]="accessoryIndex()"
      [hairColorIndex]="hairColorIndex()"
      (doorProximityChanged)="onDoorProximityChanged($event)"
    />
    <div class="lobby-stage-hint" role="status" aria-live="polite">
      @if (nearbyDoor) {
        <i class="fa-solid fa-door-open" aria-hidden="true"></i>
        <span>Đã tới cửa {{ nearbyDoor === 'outdoor' ? 'rạp ngoài trời' : 'rạp kín' }} · nhấn E để vào</span>
      } @else {
        <i class="fa-solid fa-person-walking" aria-hidden="true"></i>
      }
    </div>
    @if (nearbyDoor) {
      <button type="button" class="lobby-enter-prompt" (click)="enterSelectedDoor()">
        <kbd>E</kbd>
        <span>Vào {{ nearbyDoor === 'outdoor' ? 'rạp ngoài trời' : 'rạp kín' }}</span>
        <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
      </button>
    }
    <div class="lobby-movement-pad" role="group" aria-label="Điều khiển nhân vật trong sảnh">
      <button
        type="button"
        aria-label="Đi lên"
        title="Đi lên (W hoặc mũi tên lên)"
        (pointerdown)="startMovement('up', $event)"
        (pointerup)="stopMovement()"
        (pointercancel)="stopMovement()"
        (pointerleave)="stopMovement()"
        (click)="onMovementClick('up')"
      >
        <i class="fa-solid fa-chevron-up" aria-hidden="true"></i>
      </button>
      <button
        type="button"
        aria-label="Đi trái"
        title="Đi trái (A hoặc mũi tên trái)"
        (pointerdown)="startMovement('left', $event)"
        (pointerup)="stopMovement()"
        (pointercancel)="stopMovement()"
        (pointerleave)="stopMovement()"
        (click)="onMovementClick('left')"
      >
        <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
      </button>
      <button
        type="button"
        aria-label="Đi xuống"
        title="Đi xuống (S hoặc mũi tên xuống)"
        (pointerdown)="startMovement('down', $event)"
        (pointerup)="stopMovement()"
        (pointercancel)="stopMovement()"
        (pointerleave)="stopMovement()"
        (click)="onMovementClick('down')"
      >
        <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
      </button>
      <button
        type="button"
        aria-label="Đi phải"
        title="Đi phải (D hoặc mũi tên phải)"
        (pointerdown)="startMovement('right', $event)"
        (pointerup)="stopMovement()"
        (pointercancel)="stopMovement()"
        (pointerleave)="stopMovement()"
        (click)="onMovementClick('right')"
      >
        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
      </button>
    </div>
  </section>

</main>
