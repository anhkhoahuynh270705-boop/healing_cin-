<main class="lobby-page">
  <div class="lobby-ambient lobby-ambient--left" aria-hidden="true"></div>
  <div class="lobby-ambient lobby-ambient--right" aria-hidden="true"></div>

  <header class="lobby-header">
    <a class="lobby-brand" href="/" aria-label="Healing Ciné - sảnh chính">
      <span class="lobby-brand-mark"><i class="fa-solid fa-clapperboard" aria-hidden="true"></i></span>
      <span><strong>HEALING CINÉ</strong><small>THE PRIVATE MOVIE LOUNGE</small></span>
    </a>
    <div class="lobby-header-actions">
      <button type="button" class="lobby-wallet-button" (click)="donationRequested.emit()">
        <i class="fa-solid fa-gift" aria-hidden="true"></i><span>Khuyến mãi nạp x2</span>
      </button>
      <button type="button" class="lobby-vip-button" (click)="donationRequested.emit()">
        <i class="fa-solid fa-crown" aria-hidden="true"></i><span>VIP {{ vipLevel() }}</span>
      </button>
      <button type="button" class="lobby-login-button" (click)="loginRequested.emit()">
        <i class="fa-regular fa-user" aria-hidden="true"></i>
        <span>{{ displayName() }}</span>
      </button>
    </div>
  </header>

  <section class="lobby-welcome" aria-labelledby="lobby-title">
    <p class="lobby-overline"><span></span> MỘT NƠI ĐỂ CÙNG NHAU THƯ GIÃN</p>
    <h1 id="lobby-title">Chào mừng đến <em>Healing Ciné</em></h1>
    <p class="lobby-subtitle">Chọn cánh cửa phù hợp. Bộ phim tiếp theo đang chờ bạn bên trong.</p>
  </section>

  <section class="lobby-doors" aria-label="Chọn phòng chiếu">
    <button
      type="button"
      class="lobby-door lobby-door--outdoor"
      (click)="enterCinema.emit('outdoor')"
      aria-label="Đi vào rạp chiếu ngoài trời"
    >
      <span class="door-sconce door-sconce--left" aria-hidden="true"></span>
      <span class="door-sconce door-sconce--right" aria-hidden="true"></span>
      <span class="door-arch">
        <span class="door-view door-view--outdoor">
          <span class="door-sky"></span><span class="door-moon"></span>
          <span class="door-hill door-hill--back"></span><span class="door-hill door-hill--front"></span>
          <span class="door-string-lights"></span>
        </span>
        <span class="door-frame"></span>
        <span class="door-handle" aria-hidden="true"></span>
      </span>
      <span class="door-copy">
        <span class="door-eyebrow"><i class="fa-solid fa-cloud-moon" aria-hidden="true"></i> OPEN AIR · UNDER THE STARS</span>
        <strong>Rạp ngoài trời</strong>
        <small>Gió đêm dịu nhẹ, bầu trời rộng và màn phim giữa thiên nhiên.</small>
        <span class="door-cta">Bước vào rạp <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></span>
      </span>
    </button>

    <button
      type="button"
      class="lobby-door lobby-door--indoor"
      (click)="enterCinema.emit('indoor')"
      aria-label="Đi vào rạp chiếu kín"
    >
      <span class="door-sconce door-sconce--left" aria-hidden="true"></span>
      <span class="door-sconce door-sconce--right" aria-hidden="true"></span>
      <span class="door-arch">
        <span class="door-view door-view--indoor">
          <span class="indoor-screen"></span>
          <span class="indoor-seat indoor-seat--one"></span>
          <span class="indoor-seat indoor-seat--two"></span>
          <span class="indoor-aisle"></span>
        </span>
        <span class="door-frame"></span>
        <span class="door-handle" aria-hidden="true"></span>
      </span>
      <span class="door-copy">
        <span class="door-eyebrow"><i class="fa-solid fa-door-closed" aria-hidden="true"></i> PRIVATE HALL · IMMERSIVE SOUND</span>
        <strong>Rạp kín</strong>
        <small>Ánh đèn ấm, âm thanh bao trùm và không gian xem phim riêng tư.</small>
        <span class="door-cta">Bước vào rạp <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></span>
      </span>
    </button>
  </section>

  <footer class="lobby-footer">
    <span><i class="fa-solid fa-volume-low" aria-hidden="true"></i> Hãy đeo tai nghe để tận hưởng trọn vẹn</span>
    <span class="lobby-footer-center"><i class="fa-solid fa-sparkles" aria-hidden="true"></i> YOUR QUIET PLACE, TOGETHER</span>
    <span class="lobby-status"><i></i> SẢNH ĐANG MỞ CỬA</span>
  </footer>
</main>
