<section class="admin-register-card">
  <div class="login-mark"><i class="fa-solid fa-user-shield" aria-hidden="true"></i></div>
  <p class="section-kicker">KHU VỰC QUẢN TRỊ</p>
  <h2>Tạo tài khoản admin</h2>
  <p class="login-description">Đăng ký cần Admin key do chủ hệ thống cung cấp.</p>
  <form [formGroup]="form" (submit)="submit()" class="admin-login-form">
    <label
      ><span>Tên đăng nhập (3–32 ký tự)</span
      ><input formControlName="username" autocomplete="username" required
    /></label>
    <label
      ><span>Mật khẩu (ít nhất 8 ký tự)</span
      ><div class="admin-password-field">
        <input
          formControlName="password"
          [type]="showPassword ? 'text' : 'password'"
          autocomplete="new-password"
          required
        />
        <button
          type="button"
          class="password-toggle"
          [attr.aria-label]="showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
          [attr.aria-pressed]="showPassword"
          (click)="showPassword = !showPassword"
        >
          <i
            class="fa-solid"
            [class.fa-eye]="!showPassword"
            [class.fa-eye-slash]="showPassword"
            aria-hidden="true"
          ></i>
        </button>
      </div></label
    >
    <label
      ><span>Xác nhận mật khẩu</span
      ><div class="admin-password-field">
        <input
          formControlName="confirmPassword"
          [type]="showConfirmPassword ? 'text' : 'password'"
          autocomplete="new-password"
          required
        />
        <button
          type="button"
          class="password-toggle"
          [attr.aria-label]="showConfirmPassword ? 'Ẩn mật khẩu xác nhận' : 'Hiện mật khẩu xác nhận'"
          [attr.aria-pressed]="showConfirmPassword"
          (click)="showConfirmPassword = !showConfirmPassword"
        >
          <i
            class="fa-solid"
            [class.fa-eye]="!showConfirmPassword"
            [class.fa-eye-slash]="showConfirmPassword"
            aria-hidden="true"
          ></i>
        </button>
      </div></label
    >
    <label
      ><span>Admin key</span
      ><div class="admin-password-field">
        <input
          formControlName="key"
          [type]="showAdminKey ? 'text' : 'password'"
          autocomplete="off"
          required
        />
        <button
          type="button"
          class="password-toggle"
          [attr.aria-label]="showAdminKey ? 'Ẩn admin key' : 'Hiện admin key'"
          [attr.aria-pressed]="showAdminKey"
          (click)="showAdminKey = !showAdminKey"
        >
          <i
            class="fa-solid"
            [class.fa-eye]="!showAdminKey"
            [class.fa-eye-slash]="showAdminKey"
            aria-hidden="true"
          ></i>
        </button>
      </div></label
    >
    <button type="submit" [disabled]="busy">
      {{ busy ? 'Đang tạo tài khoản…' : 'Đăng ký admin' }}
    </button>
  </form>
  @if (error) {
    <p class="admin-error" role="alert">{{ error }}</p>
  }
  <div class="admin-auth-switch">
    <span>Đã có tài khoản?</span><button type="button" (click)="showLogin.emit()">Đăng nhập</button>
  </div>
</section>
