<section class="admin-login-card">
  <div class="login-mark"><i class="fa-solid fa-shield-halved" aria-hidden="true"></i></div>
  <p class="section-kicker">KHU VỰC QUẢN TRỊ</p>
  <h2>Đăng nhập admin</h2>
  <p class="login-description">Đăng nhập để đối chiếu giao dịch và cấp quyền cho khán giả.</p>
  <form [formGroup]="form" (submit)="submit()" class="admin-login-form">
    <label
      ><span>Tên đăng nhập</span><input formControlName="username" autocomplete="username" required
    /></label>
    <label
      ><span>Mật khẩu</span
      ><div class="admin-password-field">
        <input
          formControlName="password"
          [type]="showPassword ? 'text' : 'password'"
          autocomplete="current-password"
          required
        />
        <button
          type="button"
          class="password-toggle"
          [attr.aria-label]="showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
          [attr.aria-pressed]="showPassword"
          (click)="showPassword = !showPassword"
        >
          <i
            class="fa-solid"
            [class.fa-eye]="!showPassword"
            [class.fa-eye-slash]="showPassword"
            aria-hidden="true"
          ></i>
        </button>
      </div></label
    >
    <label
      ><span>Admin key</span
      ><div class="admin-password-field">
        <input
          formControlName="key"
          [type]="showAdminKey ? 'text' : 'password'"
          autocomplete="off"
          required
        />
        <button
          type="button"
          class="password-toggle"
          [attr.aria-label]="showAdminKey ? 'Ẩn admin key' : 'Hiện admin key'"
          [attr.aria-pressed]="showAdminKey"
          (click)="showAdminKey = !showAdminKey"
        >
          <i
            class="fa-solid"
            [class.fa-eye]="!showAdminKey"
            [class.fa-eye-slash]="showAdminKey"
            aria-hidden="true"
          ></i>
        </button>
      </div></label
    >
    <button type="submit" [disabled]="busy">
      {{ busy ? 'Đang xác thực…' : 'Vào bảng quản lý' }}
      <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
    </button>
  </form>
  @if (error) {
    <p class="admin-error" role="alert">{{ error }}</p>
  }
  <div class="admin-auth-switch">
    <span>Chưa có tài khoản quản trị?</span
    ><button type="button" (click)="showRegister.emit()">Đăng ký admin</button>
  </div>
</section>
